[package]
name = "slhdsa"
version = "0.2.0"
edition = "2021"
description = "SLH-DSA with SHA-2 (FIPS 205, all six parameter sets), written in the Aeneas-translatable subset of safe Rust"

[lib]
name = "slhdsa"

[dev-dependencies]
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
slhdsa_ref = { path = "../../rust", package = "slhdsa" }
