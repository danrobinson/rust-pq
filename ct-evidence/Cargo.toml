[package]
name = "ct-evidence"
version = "0.1.0"
edition = "2021"
description = "Binary-level constant-time evidence (emulator trace comparison + dudect timing) for the slhdsa crate"
publish = false

# Standalone: not a member of any workspace, own target dir (ct-evidence/target).
[workspace]

[dependencies]
slhdsa = { path = "../rust" }
rustc-demangle = "0.1"

[features]
# Builds the crate under test with its opt-in `hw-sha2` feature (ARMv8 SHA-256
# instructions, four hash chains at a time). `./run.sh` builds both variants,
# the default one into target/ and this one into target-hw/.
hw-sha2 = ["slhdsa/hw-sha2"]

# Deliberately NO [profile.release] overrides: slhdsa is compiled with exactly
# the default cargo release profile (opt-level=3, no LTO, codegen-units=16,
# panic=unwind), i.e. the same flags `cargo build --release` uses in ../.
