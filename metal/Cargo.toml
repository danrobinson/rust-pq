[package]
name = "slhdsa-metal"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Apple Silicon Metal GPU compute backend for SLH-DSA (FIPS 205, SHA-2 parameter sets)"

[dependencies]
slhdsa = { path = "../rust", features = ["platform-sha2"] }
zeroize = "1"

[dev-dependencies]
serde_json = "1"
hex = "0.4"

[[example]]
name = "bench_metal"
path = "examples/bench_metal.rs"
