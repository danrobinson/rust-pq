[package]
name = "slhdsa"
version = "0.1.0"
edition = "2021"
description = "SLH-DSA-SHA2-128s (FIPS 205), written in the Aeneas-translatable subset of safe Rust"

[lib]
name = "slhdsa"

[features]
# Opt-in, off by default: compute the SHA-256 compression function with the
# ARMv8 SHA-256 instructions when the CPU has them (AArch64; a no-op on other
# architectures). This adds the crate's only `unsafe` code, which the Lean
# proofs do not cover; see `src/sha256.rs`, module `hw`.
hw-sha2 = []

[dev-dependencies]
serde_json = "1"
hex = "0.4"
sha2 = { version = "0.10", features = ["compress"] }
hmac = "0.12"
