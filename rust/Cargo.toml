[package]
name = "slhdsa"
version = "0.2.0"
edition = "2021"
description = "SLH-DSA with SHA-2 (FIPS 205, all six parameter sets), written in the Aeneas-translatable subset of safe Rust"

[lib]
name = "slhdsa"

[features]
# Opt-in, off by default: compute SHA-256 with the ARMv8 SHA-256 instructions
# when the CPU has them (AArch64; a no-op elsewhere). Adds
# the crate's only `unsafe` code (module `sha256::hw`). SHA-512 stays portable.
hw-sha2 = []
# Opt-in, off by default, EXPERIMENTAL and not covered by any proof: compute
# the SHA-512 compression function with the ARMv8.2 SHA-512 instructions when
# the CPU has them (module `sha512::hw`). Only the sets with n = 24, 32 use
# SHA-512. Independent of `hw-sha2`.
hw-sha512 = []

[dev-dependencies]
serde_json = "1"
hex = "0.4"
sha2 = { version = "0.10", features = ["compress"] }
hmac = "0.12"
# RustCrypto's crate, pinned as in ../compat: keys, signatures and
# encodings compared for all six sets (tests/rustcrypto.rs).
upstream = { package = "slh-dsa", version = "=0.2.0-rc.5" }
signature = "3"
pkcs8 = { version = "0.11", features = ["alloc"] }
