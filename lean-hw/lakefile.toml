name = "slhdsa_hw"
defaultTargets = ["Slhdsa"]
# Reuse the dependency checkouts of ../lean.
packagesDir = "../lean/.lake/packages"

[[require]]
name = "aeneas"
path = "../.tools/aeneas/backends/lean"

# The generic FIPS 205 transcription, compiled in place from ../lean (not copied).
[[lean_lib]]
name = "Spec"
srcDir = "../lean"

[[lean_lib]]
name = "Platform"
srcDir = "../lean"

# The instruction model of the hardware backend (`Arm.lean`, trusted: a transcription of the
# Arm ARM pseudocode of the instructions the wrappers of `sha256::hw::arm` (eighteen) and
# `sha512::hw::arm` (ten) call).
[[lean_lib]]
name = "Arm"

[[lean_lib]]
name = "Shakebatch"

# The Aeneas translation of rust/ built with `hw-sha2` (scripts/extract-hw.sh), and its
# proofs. Proof files that do not depend on the build, and the headline files, are symbolic
# links into ../lean/Slhdsa. This package's own files: the wrapper model
# (`Slhdsa/{Types,Funs}External.lean`, trusted, with `Arm.lean`), `Slhdsa/Proofs/CompressTop.lean`,
# `Slhdsa/Proofs/Compress512Top.lean`, `Slhdsa/Proofs/ChainTop.lean`, `Slhdsa/Proofs/Hw/*.lean`
# (the single-block kernel, the wrappers, and the chain kernel generic in `N`) and
# `Slhdsa/Proofs/Hw512/*.lean` (the SHA-512 wrappers and kernel).
[[lean_lib]]
name = "Slhdsa"

# The constant-time proofs for this build (`Ct/`). Files that do not depend on the build are
# symbolic links into ../lean/Ct; `Ct/Funs.lean` is generated by `scripts/ct-gen.sh hw`.
[[lean_lib]]
name = "Ct"

[[lean_lib]]
name = "Facade"

