[package]
name = "slhdsa_current"
version = "0.1.0"
edition = "2021"
description = "Copy of ../../../rust/src (the optimised verified crate), with an optional SHA-256 compression counter (feature `count`). Used only for counting."
publish = false

[features]
count = []
# Declared only so that the copied sources compile without cfg warnings; never enabled here.
hw-sha2 = []

[dev-dependencies]
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
hmac = "0.12"
