[package]
name = "slhdsa-bench"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Benchmarks of the verified SLH-DSA-SHA2-128s crate (../rust) against other implementations"

[features]
# Force the portable SHA-256 in sha2 0.10 (used by fips205). sha2 0.11 (used by
# RustCrypto slh-dsa) is forced with RUSTFLAGS='--cfg sha2_backend="soft"' instead.
soft = ["sha2_010/force-soft"]
# Opt in to sha2 0.10's ARMv8 backend, which it only uses with its `asm` feature
# (without it, fips205 as shipped hashes with portable code on aarch64).
asm010 = ["sha2_010/asm"]

[dependencies]
slhdsa = { path = "../rust" }
# `verified-before`: the pre-optimisation verified crate. Cargo cannot depend on two
# path packages both named `slhdsa`, so this is variants/base, a copy of
# ../opt/original/rust/src whose only difference is a compression counter compiled
# in only with feature `count` (never enabled in the benchmarks); run.sh checks this.
slhdsa_base = { path = "variants/base" }
slhdsa_a = { path = "variants/a" }
slhdsa_b = { path = "variants/b" }
slhdsa_c = { path = "variants/c" }
slhdsa_d = { path = "variants/d" }
slh-dsa = "=0.2.0-rc.5"
fips205 = { version = "=0.5.0", default-features = false, features = ["slh-dsa-sha2-128s"] }
pqcrypto-sphincsplus = "=0.7.2"
pqcrypto-traits = "0.3"
sha2 = "=0.11.1"
sha2_010 = { package = "sha2", version = "=0.10.9" }
rand_core_06 = { package = "rand_core", version = "0.6" }
hex = "0.4"
serde_json = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "sig"
harness = false

[[bench]]
name = "sha"
harness = false

[workspace]
members = [".", "variants/base", "variants/a", "variants/b", "variants/c", "variants/current", "variants/d", "count"]
default-members = ["."]
